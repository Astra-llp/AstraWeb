<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="astraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="100%" stop-color="#00A389" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#004D40" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Hex / Shield Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#astraGrad)" />
  
  <!-- Medical Cross & Pulse Wave Emblem -->
  <g filter="url(#shadow)">
    <!-- Pulse Line with Heartbeat Peak -->
    <path
      d="M10 33 L20 33 L24 25 L30 43 L36 19 L41 37 L45 31 L48 33 L54 33"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Golden Star Accent (Astra) -->
    <path
      d="M48 14 L50 19 L55 20 L51 24 L52 29 L48 26 L44 29 L45 24 L41 20 L46 19 Z"
      fill="#F59E0B"
    />
  </g>
</svg>